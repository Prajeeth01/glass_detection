[tool.poetry]
name = "glass_detection"
version = "1.0.1"
description = "ROS 2 package for detecting glass objects."
authors = ["Prajeeth <pra7805s@hs-coburg.de>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
lark = "^1.3.1"
numpy = "<2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^7.0.0"
flake8 = "^7.3.0"
ruff = "^0.15.1"
mypy = "^1.19.1"
pre-commit = "^4.5.1"
isort = "^7.0.0"
pydocstyle = "^6.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E203"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["test"]
